# Platform rules: text limits (characters), hashtag count, video limits.
# Edit freely when a platform changes its rules; no code changes needed.
#
#   implemented      - adapter exists in app/publishers/
#   has_title        - platform has a separate title field; if false, title goes into the text
#   title_max        - title length limit
#   description_max  - limit of the main text field (hashtags are appended to it and count too)
#   hashtags_max     - recommended / allowed number of hashtags
#   style            - hint for AI text adaptation
#   video.max_duration_sec, video.max_size_mb, video.formats (file extensions),
#   video.aspect_ratios (recommended, "w:h")
#
# Values checked against public docs in Oct 2026; "# verify" marks values where sources disagree.

youtube:
  name: YouTube
  method: browser
  implemented: true
  has_title: true
  title_max: 100
  description_max: 5000
  hashtags_max: 15            # more than 15 hashtags -> YouTube ignores all of them
  style: "SEO-friendly title with keywords first; detailed description, first 2 lines matter most; 3-5 relevant hashtags."
  video:
    max_duration_sec: 43200   # 12 h for verified accounts; 15 min for unverified
    max_size_mb: 262144       # 256 GB
    formats: [mp4, mov, avi, wmv, flv, webm, mkv, 3gp, mpeg, mpg]
    aspect_ratios: ["16:9", "9:16", "1:1"]   # vertical/square up to 180 s becomes a Short
  notes: "Shorts: vertical or square video up to 3 minutes."

telegram:
  name: Telegram
  method: api
  implemented: true
  has_title: false
  title_max: 0
  description_max: 1024       # video caption limit
  hashtags_max: 5
  style: "Short friendly channel post; first line is a bold-ish hook; emojis allowed; few hashtags at the end."
  video:
    max_duration_sec: 86400
    max_size_mb: 50           # Bot API upload limit (2000 MB only with a local Bot API server)
    formats: [mp4, mov, mkv, webm]
    aspect_ratios: ["16:9", "9:16", "1:1", "4:5"]

